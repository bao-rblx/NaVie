[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "navie"
version = "0.1.0"
description = "NaVie: Vietnam route planner with our own search algorithms"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "numpy==2.2.1",
    "scipy==1.15.0",
]

[project.optional-dependencies]
# Graph download only (scripts/build_graph.py). Not imported by navie/.
data = ["osmnx==2.0.1"]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.8.6",
    "mypy==1.14.1",
    "networkx==3.4.2",   # test oracle only (AGENTS.md rule 1)
    "httpx==0.28.1",     # required by fastapi.testclient
]

[tool.setuptools.packages.find]
include = ["navie*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=navie --cov-report=term-missing"
